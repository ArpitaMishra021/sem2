<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odd or Even Checker</title>
</head>
<body>
     <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #b5f6ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: rgb(243, 210, 199);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        h2 {
            color: #333;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            background-color:#c7fba4 ;
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #0077cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Odd or Even Checker</h2>
        <input type="number" id="number" placeholder="Enter a number">
        <br>
        <button onclick="checkNumber()">Check</button>
        <p id="result"></p>
    </div>
    <script>
        function checkNumber() {
            let num = document.getElementById("number").value;
            if (num === "") {
                document.getElementById("result").innerText = "Please enter a number!";
                return;
            }
            if (num % 2 === 0) {
                document.getElementById("result").innerText = num + " is an even number";
            } else {
                document.getElementById("result").innerText = num + " is an odd number";
            }
        }
    </script>
</body>
</html>
